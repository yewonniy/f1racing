version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: f1-racing-postgres
    environment:
      POSTGRES_DB: f1racing
      POSTGRES_USER: f1user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c timezone=Asia/Seoul
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - f1-racing-network

  redis:
    image: redis:7-alpine
    container_name: f1-racing-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - f1-racing-network

volumes:
  postgres_data:
  redis_data:

networks:
  f1-racing-network:
    driver: bridge
